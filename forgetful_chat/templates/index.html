<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Private Chat - Local AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .msg-user {
      align-self: end;
      background: #1e293b;
    }

    .msg-assistant {
      align-self: start;
      background: #1e40af;
    }
  </style>
</head>

<body class="h-screen flex flex-col">
  <header class="bg-slate-900 p-4 text-center">
    <h1 class="text-2xl font-bold">Private Chat - Local AI</h1>
  </header>
  <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
  <form id="form" class="p-4 bg-slate-900 flex gap-2">
    <input type="text" id="input" autocomplete="off" required
      class="flex-1 bg-slate-800 rounded-lg px-4 py-3 text-white outline-none" placeholder="Ask anything...">
    <button type="submit" class="bg-blue-700 hover:bg-blue-600 rounded-lg px-6 py-3">Send</button>
  </form>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    form.onsubmit = async (e) => {
      e.preventDefault();
      if (!input.value.trim()) return;
      addMessage(input.value, 'user');
      const response = await fetch('/chat', {
        method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams({user_message: input.value})
      });
      addMessage('', 'assistant');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let assistantMsg = document.querySelector('.msg-assistant:last-child .content');
      if (!assistantMsg) {
        console.error('No div found to display the response!');
        return;
      }

      while (true) {
        const {done, value} = await reader.read();
        if (done) {
          break;
        }
        assistantMsg.innerHTML += decoder.decode(value, {stream: true}).replace(/\n/g, '<br>');
      }
      input.value = '';
    };

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `max-w-3xl mx-auto p-4 rounded-lg msg-${role}`;
      div.innerHTML = `<div class="content prose prose-invert max-w-none">${text.replace(/\n/g, '<br>')}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>

</html>
